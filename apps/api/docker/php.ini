; Ghi de len php.ini-production cho image backend (web, reverb, queue, scheduler).
expose_php = Off
memory_limit = 256M

; Khop gioi han o tang validate: 5 anh x 5MB (tin dang) = 25MB + overhead, tep tin nhan 5MB.
upload_max_filesize = 6M
post_max_size = 26M
max_file_uploads = 10

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Image bat bien (code COPY luc build) nen khong can kiem tra mtime.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
