name: E2E (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-trixie
        env:
          POSTGRES_DB: rental_e2e
          POSTGRES_USER: rental
          POSTGRES_PASSWORD: rental
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rental"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: rental_e2e
      DB_USERNAME: rental
      DB_PASSWORD: rental
      BROADCAST_CONNECTION: "null"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ---- API: deps, schema, seed data, then serve on :8000 ----
      - uses: ./.github/actions/setup-php

      - name: Backend env, key, storage link
        working-directory: apps/api
        run: |
          cp .env.example .env
          php artisan key:generate --force
          # public/storage is a gitignored symlink: without it /storage/* falls
          # through to Laravel's index.php (403/404) instead of serving images.
          php artisan storage:link

      - name: Migrate and seed demo data
        working-directory: apps/api
        run: php artisan migrate:fresh --seed --force

      - name: Serve API on :8000
        working-directory: apps/api
        run: |
          # CORS must accept the preview origin the browser will use.
          PHP_CLI_SERVER_WORKERS=4 FRONTEND_URL=http://localhost:4173 nohup php artisan serve \
            --host=127.0.0.1 --port=8000 --no-reload > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/cities > /dev/null && break
            [ "$i" = 30 ] && { cat /tmp/api.log; exit 1; }
            sleep 1
          done
          echo "API ready"

      # ---- Web: the bundle built by the web job, served on :4173 ----
      - uses: ./.github/actions/setup-node

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}

      - name: Install Playwright chromium
        working-directory: apps/web
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Serve bundle on :4173
        working-directory: apps/web
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 4173 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            [ "$i" = 30 ] && { cat /tmp/web.log; exit 1; }
            sleep 1
          done
          echo "web ready"

      # The bundle bakes VITE_API_URL (default http://localhost:8000/api) at build
      # time; FRONTEND_URL=4173 on the API allows that origin.
      - name: Playwright tests
        working-directory: apps/web
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:4173

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
          if-no-files-found: ignore

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "=== /tmp/api.log ==="; cat /tmp/api.log || true
          echo "=== /tmp/web.log ==="; cat /tmp/web.log || true
          echo "=== laravel.log ==="; cat apps/api/storage/logs/laravel.log || true
