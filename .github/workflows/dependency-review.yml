name: Dependency review

# Blocks a pull request that adds a dependency with a known vulnerability or a
# licence we do not want to ship.
#
# Needs the repository's "Dependency graph" switched on (Settings > Advanced
# Security). Until then the job is skipped instead of failing every PR; once it
# is on, set the repository variable DEPENDENCY_GRAPH=true to start enforcing.
on:
  pull_request:
    branches: [unstable, stable]

permissions:
  contents: read

jobs:
  review:
    if: vars.DEPENDENCY_GRAPH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: never
