name: Web (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node

      # ESLint (strictTypeChecked, --max-warnings 0) covers src and e2e.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      # Unit tests (Vitest, jsdom): fast, run before the slower build and e2e.
      - name: Unit tests
        run: npm test

      # Dead code gate: unused files, exports, types and dependencies fail the job.
      - name: knip (dead code)
        run: npm run knip

      # Zero-warning build: any Vite/Rollup warning fails the job, not just errors.
      - name: Build (warnings are errors)
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          if grep -Eiq '\(!\)|warning' build.log; then
            echo "::error::the production build printed warnings"
            exit 1
          fi

      # The e2e job serves exactly this bundle: what is tested is what was built.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: error

      # Production dependencies must be clean at every severity; dev tooling may
      # not carry a high or critical advisory.
      - name: npm audit (production, any severity)
        run: npm audit --omit=dev --audit-level=low

      - name: npm audit (all, high and above)
        run: npm audit --audit-level=high
