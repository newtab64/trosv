name: Stack smoke (reusable)

on:
  workflow_call:

permissions:
  contents: read

# The e2e job runs the API with `php artisan serve` and the web bundle with `vite preview`, so
# nothing else exercises what actually ships: the Docker images and docker-compose.yml (nginx in
# front, FrankenPHP/Laravel, Reverb, queue, scheduler). This job starts that stack for real and
# runs scripts/stack-smoke.py against it. It also gates Deploy, because Deploy fires on CI
# success and ci-ok needs this job.
jobs:
  stack:
    name: stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: trosv-ci
      REVERB_APP_KEY: ci-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same required variables a real server provides in .env (see docker-compose.yml header).
      - name: Compose environment
        run: |
          {
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "REVERB_APP_ID=ci"
            echo "REVERB_APP_KEY=${REVERB_APP_KEY}"
            echo "REVERB_APP_SECRET=ci-secret"
            echo "SEED_ON_BOOT=1"
          } > .env

      # `up` itself waits for the backend to be healthy before starting queue and scheduler
      # (depends_on), i.e. after migrations. Not using `--wait`: older Compose versions exit 1
      # for services without a healthcheck (queue, scheduler).
      - name: Build and start the stack
        run: docker compose up -d --build db backend reverb queue scheduler frontend

      - name: Wait until healthy
        run: |
          set -euo pipefail
          for service in backend frontend reverb; do
            for i in $(seq 1 90); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q "$service")" 2>/dev/null || true)"
              [ "$status" = healthy ] && break
              [ "$i" = 90 ] && { echo "::error::$service not healthy after 180 s (status: ${status:-none})"; exit 1; }
              sleep 2
            done
            echo "$service healthy"
          done

      - name: Smoke test
        run: python3 scripts/stack-smoke.py

      # A fresh stack must not log errors from the workers (this caught queue/scheduler racing
      # the migrations: relation "cache" does not exist).
      - name: Workers started cleanly
        run: |
          set -euo pipefail
          for service in queue scheduler; do
            state="$(docker inspect -f '{{.State.Status}}' "$(docker compose ps -q "$service")")"
            echo "$service: $state"
            [ "$state" = running ] || { echo "::error::$service is $state"; exit 1; }
          done
          if docker compose logs --no-color queue scheduler | grep -Ei 'error|exception|fatal'; then
            echo "::error::queue/scheduler logged errors on a fresh start"
            exit 1
          fi

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
